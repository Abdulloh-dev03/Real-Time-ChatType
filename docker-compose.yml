services:
  backend:
    build:
      context: ./backend
    container_name: chattype-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    command: node dist/server.js
    networks:
      - chattype-net

  frontend:
    build:
      context: ./frontend
    container_name: chattype-frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - chattype-net

networks:
  chattype-net:
